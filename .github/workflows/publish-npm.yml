# 发布到 npmjs.org
# 1. 在 https://www.npmjs.com/settings/~/tokens 创建 Granular Access Token
#    - Permissions: Read and write
#    - Packages: All packages（或选 webocr）
#    - 勾选 Bypass two-factor authentication
# 2. 仓库 Settings → Secrets → Actions → New：名称 NPM_TOKEN，值为上面的 token
# 3. Actions → Publish to npm → Run workflow
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
